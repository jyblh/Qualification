<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>115秋季校園徵才系列活動｜錄取資格查詢</title>
  <style>
    :root{
      --black:#070708;
      --green:#00bf63;
      --blue:#0538ff;
      --pink:#f5a3ef;
      --white:#ffffff;
      --muted:#d8d8e8;
      --glass:rgba(255,255,255,.10);
      --border:rgba(255,255,255,.22);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      font-family:"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;
      color:var(--white);
      background:#050506;
      overflow-x:hidden;
    }
    .page{
      min-height:100vh;
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:48px 18px;
      background:
        radial-gradient(circle at 10% 18%, rgba(0,191,99,.36), transparent 18%),
        radial-gradient(circle at 88% 12%, rgba(5,56,255,.42), transparent 24%),
        radial-gradient(circle at 82% 86%, rgba(245,163,239,.26), transparent 20%),
        linear-gradient(135deg,#07110d 0%,#050506 42%,#071034 100%);
    }
    .page:before{
      content:"";
      position:absolute;
      inset:0;
      opacity:.26;
      pointer-events:none;
      background-image:
        radial-gradient(#fff 1px, transparent 1px),
        radial-gradient(#fff 1px, transparent 1px);
      background-size:26px 26px,44px 44px;
      background-position:0 0,17px 21px;
      mix-blend-mode:screen;
    }
    .page:after{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.55));
    }
    .wrap{
      position:relative;
      z-index:1;
      width:min(980px,100%);
      text-align:center;
    }
    .top-badge{
      display:inline-block;
      background:var(--green);
      color:#fff;
      border:3px solid #000;
      box-shadow:8px 8px 0 #000;
      padding:13px 26px;
      font-size:clamp(16px,2vw,24px);
      font-weight:950;
      letter-spacing:.08em;
      margin-bottom:26px;
    }
    .headline{
      margin:0;
      font-family:Impact,"Arial Black","Noto Sans TC",sans-serif;
      font-size:clamp(76px,15vw,176px);
      line-height:.82;
      letter-spacing:-.055em;
      color:var(--pink);
      text-transform:uppercase;
      text-shadow:7px 7px 0 #000;
    }
    .subhead{
      margin:24px auto 30px;
      font-size:clamp(20px,3vw,34px);
      line-height:1.55;
      font-weight:950;
      text-shadow:4px 4px 0 #000;
    }
    .event-row{
      display:flex;
      flex-wrap:wrap;
      justify-content:center;
      gap:14px;
      margin:0 auto 28px;
    }
    .event-pill{
      background:#fff;
      color:#101014;
      border:3px solid #000;
      border-radius:999px;
      padding:12px 20px;
      font-weight:950;
      box-shadow:6px 6px 0 #000;
    }
    .event-pill span{color:#555;font-size:14px;margin-left:6px;}
    .query-card{
      width:min(760px,100%);
      margin:0 auto;
      text-align:left;
      background:linear-gradient(145deg,rgba(255,255,255,.17),rgba(255,255,255,.08));
      border:1px solid var(--border);
      border-radius:28px;
      padding:30px;
      box-shadow:0 24px 70px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.16);
      backdrop-filter:blur(14px);
    }
    .form-title{
      margin:0 0 8px;
      font-size:28px;
      font-weight:950;
    }
    .hint{
      margin:0 0 22px;
      color:var(--muted);
      line-height:1.75;
      font-size:15px;
    }
    form{display:grid;gap:18px;}
    label{
      display:block;
      margin-bottom:8px;
      font-weight:900;
      color:#fff;
    }
    input{
      width:100%;
      border:3px solid #000;
      border-radius:16px;
      padding:15px 16px;
      font-size:17px;
      outline:none;
      background:#fff;
      color:#111;
      box-shadow:5px 5px 0 rgba(0,0,0,.55);
    }
    input:focus{box-shadow:5px 5px 0 var(--pink);}
    button{
      margin-top:6px;
      appearance:none;
      border:4px solid #000;
      border-radius:18px;
      background:var(--green);
      color:#fff;
      padding:16px 20px;
      font-size:20px;
      font-weight:950;
      cursor:pointer;
      box-shadow:8px 8px 0 #000;
      transition:.16s ease;
    }
    button:hover{transform:translate(-2px,-2px);box-shadow:10px 10px 0 #000;}
    button:disabled{opacity:.65;cursor:not-allowed;transform:none;}
    .note{font-size:13px;line-height:1.7;color:#d7d7e2;margin-top:2px;}
    .result{
      display:none;
      margin-top:20px;
      border:3px solid #000;
      border-radius:20px;
      padding:18px 20px;
      background:#fff;
      color:#111;
      box-shadow:6px 6px 0 #000;
      line-height:1.7;
    }
    .result.show{display:block;}
    .result.ok{background:#f1fff7;}
    .result.wait{background:#fff9e8;}
    .result.no{background:#fff1f1;}
    .result h3{margin:0 0 8px;font-size:22px;}
    .result .company{font-weight:950;color:#111;}
    .footer{
      margin-top:26px;
      color:#cfcfde;
      font-size:13px;
      line-height:1.8;
      text-align:center;
    }
    .shape{
      position:absolute;
      z-index:0;
      pointer-events:none;
      font-family:Impact,"Arial Black",sans-serif;
      font-weight:900;
      -webkit-text-stroke:4px #000;
      text-shadow:6px 6px 0 #000;
      opacity:.95;
    }
    .shape.s1{left:4vw;top:10vh;font-size:92px;color:var(--green);transform:rotate(-15deg);}
    .shape.s2{right:5vw;top:10vh;font-size:104px;color:var(--blue);transform:rotate(13deg);}
    .shape.s3{left:9vw;bottom:8vh;font-size:82px;color:var(--pink);transform:rotate(10deg);}
    .shape.s4{right:12vw;bottom:10vh;font-size:80px;color:var(--green);transform:rotate(-10deg);}
    @media(max-width:720px){
      .page{align-items:flex-start;padding:34px 14px 44px;}
      .query-card{padding:22px 18px;border-radius:22px;}
      .headline{text-shadow:5px 5px 0 #000;}
      .subhead{margin-top:18px;}
      .event-pill{width:100%;border-radius:18px;text-align:center;}
      .event-pill span{display:block;margin-left:0;margin-top:4px;}
      .shape{display:none;}
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="shape s1">?</div>
    <div class="shape s2">▱</div>
    <div class="shape s3">@</div>
    <div class="shape s4">⌕</div>

    <div class="wrap">
      <div class="top-badge">115秋季校園徵才系列活動</div>
      <div class="subhead">錄取資格查詢系統<br>請輸入企業統一編號與聯絡信箱</div>

      <div class="event-row">
        <div class="event-pill">10/12－10/15 企業說明會 <span>第六教學大樓國際會議廳</span></div>
        <div class="event-pill">10/16 實習媒合日 <span>一大川堂</span></div>
      </div>

      <section class="query-card">
        <form id="queryForm">
          <div>
            <h2 class="form-title">錄取資格查詢</h2>
            <p class="hint">請使用報名時填寫的企業統一編號與聯絡人電子信箱進行查詢。若查無資料，請先確認統編、Email 是否與報名資料一致。</p>
          </div>
          <div>
            <label for="taxId">企業統一編號</label>
            <input id="taxId" name="id" type="text" inputmode="numeric" maxlength="8" placeholder="例：12345678" required>
          </div>
          <div>
            <label for="email">聯絡人電子信箱</label>
            <input id="email" name="email" type="email" placeholder="請輸入報名時填寫的 Email" required>
          </div>
          <button id="submitBtn" type="submit">立即查詢</button>
          <div class="note">系統將依報名資料進行比對。查詢結果僅供本活動資格確認使用。</div>
        </form>
        <div id="resultBox" class="result"></div>
      </section>

      <div class="footer">國立臺北科技大學 研究發展處 就業輔導組｜115秋季校園徵才系列活動</div>
    </div>
  </main>

  <script>
    // TODO：請將下方網址替換為你的 Google Apps Script Web App URL
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/請替換成你的GAS部署網址/exec";

    const form = document.getElementById("queryForm");
    const resultBox = document.getElementById("resultBox");
    const submitBtn = document.getElementById("submitBtn");

    function showResult(type, title, message){
      resultBox.className = "result show " + type;
      resultBox.innerHTML = `<h3>${title}</h3><div>${message}</div>`;
    }

    form.addEventListener("submit", async function(e){
      e.preventDefault();
      const id = document.getElementById("taxId").value.trim();
      const email = document.getElementById("email").value.trim();

      if(!/^\d{8}$/.test(id)){
        showResult("no", "資料格式有誤", "企業統一編號需為 8 碼數字。請重新確認後再送出。");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "查詢中...";
      resultBox.className = "result show wait";
      resultBox.innerHTML = "<h3>查詢中</h3><div>正在比對報名資料，請稍候。</div>";

      try{
        const url = `${GAS_WEB_APP_URL}?id=${encodeURIComponent(id)}&email=${encodeURIComponent(email)}`;
        const res = await fetch(url, { method:"GET" });
        const data = await res.json();

        if(data.status === "admitted"){
          showResult("ok", "查詢結果：已錄取", `<p><span class="company">${data.company || "貴公司"}</span> 已錄取本次活動。請依通知信內容完成後續確認程序。</p>`);
        }else if(data.status === "waitlist"){
          showResult("wait", "查詢結果：備取", `<p><span class="company">${data.company || "貴公司"}</span> 目前為備取資格。後續若有名額釋出，將另行通知。</p>`);
        }else if(data.status === "not_admitted"){
          showResult("no", "查詢結果：未錄取", `<p><span class="company">${data.company || "貴公司"}</span> 本次未錄取。感謝貴公司支持臺北科技大學校園徵才活動。</p>`);
        }else if(data.status === "not_open"){
          showResult("wait", "尚未開放查詢", "錄取資格查詢尚未開放，請依公告時間再行查詢。");
        }else{
          showResult("no", "查無資料", "查無符合資料。請確認企業統一編號與聯絡人電子信箱是否與報名資料一致。");
        }
      }catch(error){
        showResult("no", "系統暫時無法查詢", "目前無法連線至查詢系統。請稍後再試，或確認 GAS Web App URL 是否已正確替換。");
      }finally{
        submitBtn.disabled = false;
        submitBtn.textContent = "立即查詢";
      }
    });
  </script>
</body>
</html>
